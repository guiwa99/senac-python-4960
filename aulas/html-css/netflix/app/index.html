<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">

    <title>Netflix</title>
</head>

<body>
    <header class="header">

        <div class="header-left-side">
            <img src="./images/logo.jpg" alt="Logo Netflix" class="header-logo">

            <ul class="header-left-menu">
                <a href="#">
                    <li class="header-left-menu-item">Início</li>
                </a>

                <a href="#">
                    <li class="header-left-menu-item">Séries</li>
                </a>

                <a href="#">
                    <li class="header-left-menu-item">Filmes</li>
                </a>

                <a href="#">
                    <li class="header-left-menu-item">Minha lista</li>
                </a>
            </ul>
        </div>

        <div class="header-right-side">
            <button>
                <i class="bi bi-search header-right-side-item"></i>
            </button>
            <button>
                <i class="bi bi-bell-fill header-right-side-item"></i>
            </button>

            <button>
                <img src="./images/user-icon.jpg" alt="Icone de usuário" class="header-user-icon">
                <i class="bi bi-caret-down-fill"></i>
            </button>
        </div>
    </header>
</body>

</html>
