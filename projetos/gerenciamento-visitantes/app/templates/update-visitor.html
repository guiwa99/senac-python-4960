{% extends 'base.html' %}

{% block title %}
Atualizar visitante
{% endblock %}

{% block content %}
<div>
    <h1>Atualizar visitante existente</h1>
    <p>Use o formulário abaixo para atualizar um visitante</p>

    <form action="./" method="post">
        {% csrf_token %}

        <div class="d-flex gap-3 flex-wrap">
            <div class="col">
                <div>
                    <label for="first_name" class="form-label">Primeiro nome</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ visitor.first_name }}">
                </div>

                <div>
                    <label for="last_name" class="form-label">Último nome</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ visitor.last_name }}">
                </div>

                <div>
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" name="cpf" value="{{ visitor.cpf }}">
                </div>

            </div>

            <div class="col">

                <div>
                    <label for="birth_date" class="form-label">Data de nascimento</label>
                    <input type="date" class="form-control" id="birth_date" name="birth_date"
                        value="{{ visitor.birth_date|date:'Y-m-d' }}">
                </div>

                <div>
                    <label for="ticket_date" class="form-label">Data do ingresso</label>
                    <input type="date" class="form-control" id="ticket_date" name="ticket_date"
                        value="{{ visitor.ticket_date|date:'Y-m-d' }}">
                </div>

                <div>
                    <label for="ticket_type" class="form-label">Tipo do ingresso</label>
                    <select name="ticket_type" id="ticket_type" class="form-select">
                        <option value="1" {% if visitor.ticket_type == 1 %} selected {% endif %}>Normal</option>
                        <option value="2" {% if visitor.ticket_type == 2 %} selected {% endif %}>VIP</option>
                        <option value="3" {% if visitor.ticket_type == 3 %} selected {% endif %}>Premium</option>
                    </select>
                </div>
    
            </div>
            
            <div class="col">
                <div>
                    <label for="ticket_number" class="form-label">Número do ingresso</label>
                    <input disabled type="text" class="form-control" id="ticket_number" name="ticket_number" value="{{ visitor.ticket_number }}">
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a href="../../" class="btn btn-outline-primary mt-3 btn-custom">Voltar</a>
                    <input type="submit" value="Atualizar" class="btn btn-success mt-3 btn-custom">
                </div>

            </div>
        </div>
    </form>
</div>
{% endblock %}
